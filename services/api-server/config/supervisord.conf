[supervisord]
nodaemon=true
minfds=1024
minprocs=200
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:app]
; The original command to run the server, wrapped in the non-priv entrypoint to handle venv setup
command=/custom-docker-entrypoint-nonpriv.sh %(ENV_APP_COMMAND)s
user=python
# Explicitly set HOME.
environment=HOME="/home/python"
autostart=true
autorestart=%(ENV_APP_AUTORESTART)s
; This ensures app doesn't start until mount-helper finishes (conceptually).
; Supervisor doesn't support 'depends_on' natively in standard version. 
; We'll use a wrapper in run_api_server.sh or rely on mount_helper to block? 
; Actually, mount_helper just binds. The app might fail if it starts too early?
; Better: The 'app' command should wait for the mount if FUSE is on.
; Or use a 3rd party plugin. 
; Simplest: 'mount-helper' does the binding. 'app' script has a 'wait-for-mount' check (which it already kind of has via waiting for files?).
; To be robust: We'll add a 'wait_for_mount' loop in the app start script or wrapper?
; Actually, let's make the 'mount-helper' blocking: No, supervisor starts all in parallel.
; Resolution: The 'mount-helper' script is fast. The 'app' script (run_api_server.sh) should probably "wait for /app/backend/.venv/bin/activate" to exist.
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[eventlistener:stop-on-app-exit]
command=/stop_supervisor.sh
events=PROCESS_STATE_EXITED
