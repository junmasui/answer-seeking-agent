services:
  api-server:
    image: 'localhost/localhost/agent-backend:python-3.12-cuda13'
    profiles: [  api-server, backend, all ]

    environment:
      DEBUGGER_LISTEN: true
      JWT_WRITE_CLAIM_MISSING_OK: true
      HEALTHCHECK_URL: 'http://127.0.0.1:8100/status'
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda13' or 'cpu'
      ##
    env_file:
      - backend.env
      - opentelemetry-instrument.env
    networks:
      - agent-net
    volumes:
      # Mount the project directory to /app in the container
      ### - ../../../backend:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ../config/run_api_server.sh:/run_api_server.sh:ro
      - ../config/healthcheck.sh:/healthcheck.sh:ro
      - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
    secrets:
      - agent_secrets
      - agent_api_key_secrets
      - agent_jwt_secrets
      - agent_seaweedfs_secrets
      - agent_postgres_secrets
      - checkpoints_postgres_secrets
      - redis_secrets
      - weaviate_secrets

    user: root
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ '/custom-docker-entrypoint.sh' ]
    command: [ '/run_api_server.sh' ]
    deploy:
      resources:
        limits:
          cpus: '0.5' # 50% of available CPU resources
          memory: 4G # Give enough to run local model
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      # Two-phase health check:
      #   Phase 1 — While the Python environment is syncing and before the
      #   FastAPI server starts, the sentinel file does not exist and the
      #   script returns exit 0 (container alive, not yet ready).
      #   Phase 2 — Once the FastAPI lifespan writes /tmp/app-ready the
      #   script curls the existing lightweight /status endpoint.
      test: ['CMD', 'bash', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 5s


  python-build:
    image: 'localhost/localhost/agent-backend-dev:python-3.12-cpu'
    profiles: [
      python-build
    ]

    environment:
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.


      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda13' or 'cpu'
      ##
      GPU_MODE: cpu
      ENABLE_MUTAGEN_SYNC: false
      USE_BOOTSTRAP_INSTALL: true
      SKIP_VENV_WAIT: true
      #
      PYTHONPYCACHEPREFIX: /home/python/.pycache
      # Codebase bucket credentials
      CODEBASE_ACCESS_KEY:
    env_file:
      - backend.env
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    networks:
      agent-net: {}
    volumes:
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ../config/run_build_backend.sh:/run_build_backend.sh:ro
      # Mount dist directory
      - ../../dist:/dist
      # Mount source directory
      - ../../../backend:/app/backend
      - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh
      - ../config/custom-docker-entrypoint-nonpriv.sh:/custom-docker-entrypoint-nonpriv.sh:ro

    user: root
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ '/custom-docker-entrypoint.sh' ]
    command: [ '/run_build_backend.sh' ]



#
# Named volumes are not created until the dependent service
# is started.
#
volumes:
  {}
