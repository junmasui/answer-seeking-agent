name: nemo

services:
  nemo-guardrails:
    restart: unless-stopped

    image: nemoguardrails
    profiles: [ nemo, infrastructure, all ]

    env_file:
      - nemo.env
    ports:
      - '27500:8000'
    networks:
      - agent-poc
    volumes:
      - ./config:/config
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh
      # - ./docker/nemoguardrails/pyproject.toml:/nemoguardrails/pyproject.toml
      # - ./docker/nemoguardrails/poetry.lock:/nemoguardrails/poetry.lock
      - ./docker/nemoguardrails:/nemoguardrails
    secrets:
      - answers_dev_env


    entrypoint: [ '/custom-docker-entrypoint.sh' ]
    # The option --config=/config is required for multi-config support.
    command: ["server", "--config=/config"]

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
