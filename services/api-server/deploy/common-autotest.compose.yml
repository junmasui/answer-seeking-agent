services:
  api-server-autotest:
    image: 'localhost/localhost/agent-backend-dev:python-3.12-cuda12'
    profiles: [ backend-autotest, all ]
    privileged: true

    environment:
      DEBUGGER_LISTEN: true
      JWT_WRITE_CLAIM_MISSING_OK: true
      HEALTHCHECK_URL: 'http://127.0.0.1:8100/status'
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.


      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
      ##
      ENABLE_MUTAGEN_SYNC: 'true'
      USE_BOOTSTRAP_INSTALL: 'true'
      ENABLE_SSHD: 'true'
      PYTHONPYCACHEPREFIX: /home/python/.pycache
    env_file:
      - automated-test.env
      - opentelemetry-instrument.env
    networks:
      - agent-net
    volumes:
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ../config/run_api_server.sh:/run_api_server.sh:ro
      - ../config/healthcheck.sh:/healthcheck.sh:ro
      - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
      - ../config/supervisord.conf:/etc/supervisord.conf:ro
      - ../config/custom-docker-entrypoint-nonpriv.sh:/custom-docker-entrypoint-nonpriv.sh:ro
    secrets:
      - agent_secrets
      - agent_api_key_autotest_secrets
      - agent_jwt_autotest_secrets
      - agent_seaweedfs_autotest_secrets
      - agent_postgres_autotest_secrets
      - checkpoints_postgres_autotest_secrets
      - redis_secrets
      - weaviate_secrets
      - mutagen_sshd_authorized_keys

    user: root
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_api_server.sh' ]
    deploy:
      resources:
        limits:
          memory: 4G # Give enough to run local model
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      # Two-phase health check:
      #   Phase 1 — While the Python environment is syncing, the sentinel
      #   file does not exist and the script returns exit 0.
      #   Phase 2 — Once the FastAPI lifespan writes /tmp/app-ready the
      #   script curls the existing lightweight /status endpoint.
      test: ['CMD', 'bash', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 5s



  automated-pytest:
    image: 'localhost/localhost/agent-backend-dev:python-3.12-cpu'
    profiles: [ backend-autotest, automated-pytest, all ]
    privileged: true

    environment:
      DEBUGGER_LISTEN: true
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.



      # https://github.com/docker/compose/issues/6029
      PYTHONUNBUFFERED: 1
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
      GPU_MODE: cpu
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
      ##
      ENABLE_MUTAGEN_SYNC: 'true'
      USE_BOOTSTRAP_INSTALL: 'true'
      ENABLE_SSHD: 'true'
      PYTHONPYCACHEPREFIX: /home/python/.pycache
      APP_AUTORESTART: 'false'
    env_file:
      - automated-test.env
      - opentelemetry-instrument.env
    networks:
      - agent-net
    volumes:
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ../config/run_automated_test.sh:/run_automated_test.sh:ro
      - ../config/mount_helper.sh:/usr/local/bin/mount_helper.sh:ro
      - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
      - ../config/custom-docker-entrypoint-nonpriv.sh:/custom-docker-entrypoint-nonpriv.sh:ro
      - ../config/supervisord.conf:/etc/supervisord.conf:ro
      - ../config/stop_supervisor.sh:/stop_supervisor.sh:ro
      ##SRC - backend-autotest-home-4:/home/python
      ##SRC - backend-autotest-venv-4:/app/backend/.venv
    secrets:
      - agent_secrets
      - agent_api_key_autotest_secrets
      - agent_jwt_autotest_secrets
      - agent_seaweedfs_autotest_secrets
      - agent_postgres_autotest_secrets
      - celery_flower_autotest_secrets
      - checkpoints_postgres_autotest_secrets
      - redis_secrets
      - weaviate_secrets
      - mutagen_sshd_authorized_keys

    user: root
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_automated_test.sh' ]


networks:
  agent-net:
    name: agent_agent-net
    external: true
