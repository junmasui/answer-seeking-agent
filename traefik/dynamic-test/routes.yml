http:
  routers:
    vite-app:
      rule: "Host(`localhost`)"
      entryPoints:
        - websecure
      service: vite-service
      tls: {}

    fastapi:
      rule: "Host(`localhost`) && PathPrefix(`/api/`)"
      entryPoints:
        - websecure
      service: fastapi-service
      middlewares:
        - strip-api-prefix
        - add-api-prefix-header
      tls: {}

  middlewares:
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

    add-api-prefix-header:
      headers:
        customRequestHeaders:
          X-Forwarded-Prefix: "/api"

  services:
    vite-service:
      loadBalancer:
        servers:
          - url: "http://dev-webui-server:5173"

    fastapi-service:
      loadBalancer:
        servers:
          - url: "http://dev-fastapi-server:8100"
