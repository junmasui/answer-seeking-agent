[supervisord]
nodaemon=true
minfds=1024
minprocs=200
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:app]
# Using sleep infinity to keep container alive for interactive use
command=/custom-docker-entrypoint-nonpriv.sh sleep infinity
user=python
environment=HOME="/home/python"
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[eventlistener:stop-on-app-exit]
command=/stop_supervisor.sh
events=PROCESS_STATE_EXITED
