name: redis

services:
  init-redis-volumes:
    restart: 'no'

    image: 'debian:bookworm-slim'
    profiles: [ init-volumes, redis, infrastructure-core, infrastructure, all ]

    # No network is needed to initialize named volumes
    network_mode: none
    volumes:
      - redis-data-1:/data-1

    entrypoint: 'bash'
    command:
      - '-c'
      # Beware that docker-compose also performs variable interpolation.
      # So we need to escape the dollar sign with $$name so that bash
      # will recieve our embedded script with $name. 
      - |
        set -ex ;

        for VOL in 'data-1'
        do
          touch /$$VOL/.initialized
          chown -R 999:999 /$$VOL
          chmod -R 777 /$$VOL
          ls -ld /$$VOL
        done

  redis:
    restart: unless-stopped
    depends_on:
      init-redis-volumes:
        condition: service_completed_successfully

    image: redis:latest
    profiles: [ redis, infrastructure-core, infrastructure, all ]

    ports:
      - '26379:6379'
    networks:
      - agent-poc
    volumes:
      - redis-data-1:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

    user: "redis:redis"
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    mem_limit: 1g
    memswap_limit: 2g

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  redis-data-1:
    driver: local
