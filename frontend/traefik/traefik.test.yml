api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":15180"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  
  websecure:
    address: ":15183"
    http:
      tls:
        certResolver: le

  ping:
    address: ":8082"

ping:
  entryPoint: "ping"

providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  le:
    acme:
      email: admin@example.com
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
