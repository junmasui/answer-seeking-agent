services:
  init-backend-volumes:
    restart: 'no'

    image: 'python:3.12.8-slim-bookworm'
    profiles: [ init-volumes, backend, all ]

    # No network is needed to initialize named volumes
    network_mode: none
    volumes:
      - local-backend-home-1:/home/python/home-1
      - local-backend-venv-1:/home/python/venv-1
      - local-backend-staging-1:/home/python/staging-1
      - local-backend-home-2:/home/python/home-2
      - local-backend-venv-2:/home/python/venv-2
      - local-backend-staging-2:/home/python/staging-2
      - local-backend-home-3:/home/python/home-3
      - local-backend-venv-3:/home/python/venv-3

    entrypoint: 'bash'
    command:
      - '-c'
      # Beware that docker-compose also performs variable interpolation.
      # So we need to escape the dollar sign with $$name so that bash
      # will recieve our embedded script with $name. 
      - |
        set -ex ;

        ls -ld /home/python/

        for VOL in \
          'home-1' 'venv-1' 'staging-1' \
          'home-2' 'venv-2' 'staging-2' \
          'home-3' 'venv-3'
        do
          touch /home/python/$$VOL/.initialized
          chown -R 1000:1000 /home/python/$$VOL
          chmod -R 755 /home/python/$$VOL
          ls -ld /home/python/$$VOL
        done

  backend-start-gate:
    restart: 'no'

    image: localhost/start-gate:1.0
    profiles: [ backend, infrastructure, all ]

    env_file:
      - start-gate.env
      - backend.env
    networks:
      - agent-poc
    # volumes:
    #   - ../start-gate/wait_for_resource.sh:/wait_for_resource.sh
    secrets:
      - answers_minio_dev_env
      - answers_postgres_dev_env
      - checkpoints_postgres_dev_env
      - vectors_postgres_dev_env
      - redis_env

    mem_limit: 128m
    memswap_limit: 128m
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    entrypoint: 'bash'
    command:
      - '-c'
      # Beware that docker-compose also performs variable interpolation.
      # So we need to escape the dollar sign with $$name so that bash
      # will recieve our embedded script with $name. 
      - |-

        set +e
        set +x

        source /wait_for_resource.sh

        REDIS_URL="redis://:$${REDIS_DEFAULT_PASSWORD}@redis:6379/0"

        wait_for_redis "$${REDIS_URL}"
        wait_for_minio "$${MINIO_ENDPOINT_URL}"

        DATABASE_URL=postgres://$${ANSWERS_POSTGRES_USER_NAME}:$${ANSWERS_POSTGRES_USER_PASSWORD}@pgvector:5432/$${ANSWERS_POSTGRES_DATABASE}

        wait_for_pgvector "$$DATABASE_URL"

        DATABASE_URL=postgres://$${VECTORS_POSTGRES_USER_NAME}:$${VECTORS_POSTGRES_USER_PASSWORD}@pgvector:5432/$${ANSWERS_POSTGRES_DATABASE}

        wait_for_pgvector "$$DATABASE_URL"

        DATABASE_URL=postgres://$${CHECKPOINTS_POSTGRES_USER_NAME}:$${CHECKPOINTS_POSTGRES_USER_PASSWORD}@pgvector:5432/$${ANSWERS_POSTGRES_DATABASE}

        wait_for_pgvector "$$DATABASE_URL"


  fastapi-dev-server:
    depends_on:
      init-backend-volumes:
        condition: service_completed_successfully
      backend-start-gate:
        condition: service_completed_successfully

    image: 'localhost/answers-backend:python-3.12-cuda12'
    profiles: [ backend, all ]

    environment:
      DEBUGGER_LISTEN: true
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
    env_file:
      - backend.env
    ports: # use if it is necessary to expose the container to the host machine
      - '8100:8100'
    networks:
      - agent-poc
    volumes:
      ### Mount the project directory to /app in the container
      ##- .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_fastapi_dev_server.sh:/run_fastapi_dev_server.sh
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh
      - local-backend-home-1:/home/python
      - local-backend-venv-1:/app/.venv
      - local-backend-staging-1:/staging
    secrets:
      - answers_dev_env
      - answers_jwt_dev_env
      - answers_minio_dev_env
      - answers_postgres_dev_env
      - checkpoints_postgres_dev_env
      - vectors_postgres_dev_env
      - redis_env

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_fastapi_dev_server.sh' ]
    deploy:
      resources:
        limits:
          memory: 4G # Give enough to run local model
        # # reservations:
        # #   devices:
        # #     - driver: nvidia
        # #       count: 1
        # #       capabilities: [gpu]

    healthcheck:
      # When this service start for the first time, there is multiple minutes while the
      # python environment is sync'ed to the requirements file then when the FastAPI server
      # is starting up. A health-check based on API pinging will fail during the sync and the
      # start up.
      #
      # For now, we just check if python3 can run. Later, we will  try to come up  
      ## test: ['CMD', 'curl', '-f', 'http://localhost']
      test: ['CMD', 'python3', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  celery-worker:
    depends_on:
      init-backend-volumes:
        condition: service_completed_successfully
      backend-start-gate:
        condition: service_completed_successfully

    image: 'localhost/answers-backend:python-3.12-cuda12'
    profiles: [ backend, all ]

    environment:
      DEBUGGER_LISTEN: true
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
    env_file:
      - backend.env
    ports: # use if it is necessary to expose the container to the host machine
      - '28989:8989'
    networks:
      - agent-poc
    volumes:
      ### Mount the project directory to /app in the container
      ##- .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_celery_worker.sh:/run_celery_worker.sh
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh
      - local-backend-home-2:/home/python
      - local-backend-venv-2:/app/.venv
      - local-backend-staging-2:/staging
    secrets:
      - answers_dev_env
      - answers_jwt_dev_env
      - answers_minio_dev_env
      - answers_postgres_dev_env
      - checkpoints_postgres_dev_env
      - vectors_postgres_dev_env
      - redis_env

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_celery_worker.sh' ]
    deploy:
      resources:
        limits:
          memory: 8G # Give enough to run Tesseract and local model
        # # reservations:
        # #   devices:
        # #     - driver: nvidia
        # #       count: 1
        # #       capabilities: [gpu]

    healthcheck:
      # When this service start for the first time, there is multiple minutes while the
      # python environment is sync'ed to the requirements file then when the celery worker
      # is starting up. A health-check based on API pinging will fail during the sync and the
      # start up.
      #
      # For now, we just check if python3 can run. Later, we will  try to come up  
      ## test: ['CMD', 'curl', '-f', 'http://localhost']
      test: ['CMD', 'python3', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

          
  celery-flower:
    depends_on:
      init-backend-volumes:
        condition: service_completed_successfully
      backend-start-gate:
        condition: service_completed_successfully

    image: 'localhost/answers-backend:python-3.12-cpu'
    profiles: [ backend, all ]

    environment:
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'
      GPU_MODE: cpu
    env_file:
      - backend.env
    ports: # use if it is necessary to expose the container to the host machine
      - '25555:5555'
    networks:
      agent-poc: {}
    volumes:
      ### Mount the project directory to /app in the container
      ##- .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_celery_flower.sh:/run_celery_flower.sh
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh
      - local-backend-home-3:/home/python
      - local-backend-venv-3:/app/.venv
    secrets:
      - answers_dev_env
      - answers_jwt_dev_env
      - answers_minio_dev_env
      - answers_postgres_dev_env
      - checkpoints_postgres_dev_env
      - vectors_postgres_dev_env
      - redis_env

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_celery_flower.sh' ]

    healthcheck:
      # When this service start for the first time, there is multiple minutes while the
      # python environment is sync'ed to the requirements file then when the celery flower node
      # is starting up. A health-check based on API pinging will fail during the sync and the
      # start up.
      #
      # For now, we just check if python3 can run. Later, we will  try to come up  
      ## test: ['CMD', 'curl', '-f', 'http://localhost']
      test: ['CMD', 'python3', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s



  celery-exporter:
    depends_on:
      backend-start-gate:
        condition: service_completed_successfully

    image: 'danihodovic/celery-exporter'
    profiles: [ backend, all ]

    env_file:
      - backend.env
      - celery-exporter.env
    ports:
      - '29808:9808'
    networks:
      agent-poc: {}
    volumes:
      - ./custom-docker-entrypoint.exporter.sh:/custom-docker-entrypoint.exporter.sh
    secrets:
      - redis_env

    entrypoint: [ 'bash', '/custom-docker-entrypoint.exporter.sh' ]
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    # command: null

    # healthcheck:
    #   test: ['CMD', 'curl', '-f', 'http://localhost:9808/health']
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 5s
      

#
# Named volumes are not created until the dependent service
# is started.
#
volumes:
  local-backend-home-1:
    driver: local
  local-backend-venv-1:
    driver: local
  local-backend-staging-1:
    driver: local
  local-backend-home-2:
    driver: local
  local-backend-venv-2:
    driver: local
  local-backend-staging-2:
    driver: local
  local-backend-home-3:
    driver: local
  local-backend-venv-3:
    driver: local
