[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:mutagen-sync-monitor]
command=/bin/bash /monitor_mutagen_sync.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/mutagen-sync-monitor.err.log
stdout_logfile=/var/log/supervisor/mutagen-sync-monitor.out.log
priority=100
stopwaitsecs=10
