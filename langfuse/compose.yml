volumes:
  langfuse-init-signal-1:
    driver: local

services:

  langfuse-dependency-gate:
    restart: 'no'

    image: localhost/localhost/debian-slim-util:1.0
    profiles: [ langfuse, infrastructure, all ]

    env_file:
      - dependency-gate.env
    networks:
      - agent-poc
    volumes:
      - langfuse-init-signal-1:/init-signal
      - ./run_dependency_gate.sh:/run_dependency_gate.sh
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh
      - ../dependency-gate/wait_for_resource.sh:/wait_for_resource.sh
    secrets:
      - langfuse_clickhouse_env
      - langfuse_minio_env
      - langfuse_postgres_env
      - redis_env

    mem_limit: 128m
    memswap_limit: 128m
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    entrypoint: 'bash'
    command: [ /run_dependency_gate.sh ]

  langfuse-web:
    restart: unless-stopped

    image: docker.io/langfuse/langfuse:3.24
    profiles: [ langfuse, infrastructure, all ]

    environment:
      # Only environment variables that are important to the Docker environment
      # will be configured here. All other environment variables are extracted
      # to .env files for easier and more isolated management.
      HOSTNAME: 0.0.0.0
    env_file:
      - langfuse.env
      - langfuse-web.env
    ports:
      - '23003:3000'
    networks:
      - agent-poc
    volumes:
      - langfuse-init-signal-1:/init-signal
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh
      - ./custom-docker-entrypoint.web.sh:/custom-docker-entrypoint.web.sh
    secrets:
      - langfuse_env
      - langfuse_clickhouse_env
      - langfuse_minio_env
      - langfuse_postgres_env
      - langfuse_web_env
      - redis_env

    entrypoint: [
      "dumb-init",
      "--",
      "/custom-docker-entrypoint.web.sh"
    ]
    # When entrypoint is specified in the compose file, the CMD in the Dockerfile is
    # will be ignored. Hence, extract its value and add it here in the compose file:
    #   docker inspect langfuse/langfuse:3.24 | jq '.[0].Config.Cmd'
    command: [
      "node",
      "./web/server.js",
      "--keepAliveTimeout",
      "110000"
    ]
    # set shared memory limit when using docker-compose
    shm_size: 128mb

    healthcheck:
      test:
        # The langfuse/langfuse image does not have curl installed. And since the image is based on
        # busybox, curl is not available.
        # wget: -q    Turns off wget output, specifically the progress bar.
        #       -S    Shows the server response, which includes the HTTP status code.
        #       -O -  Writes the content to stdout.
        # Use the IPv4 loopback address. When 'localhost' is used, wget will try to use
        # the IPv6 ::1 address where there is no listening port.
        # grep: -q    Quiet. Exit code 0 if PATTERN is found, 1 otherwise
        - CMD-SHELL
        - >-
          wget -qS -O - http://127.0.0.1:3000/api/public/ready 2>&1
          | grep -q 'HTTP/1.1 200 OK'

      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  langfuse-worker:
    restart: unless-stopped

    image: docker.io/langfuse/langfuse-worker:3.24
    profiles: [ langfuse, infrastructure, all ]

    environment:
      # Only environment variables that are important to the Docker environment
      # will be configured here. All other environment variables are extracted
      # to .env files for easier and more isolated management.
      HOSTNAME: 0.0.0.0
    env_file:
      - langfuse.env
    ports:
      - '24030:3030'
    networks:
      - agent-poc
    volumes:
      - langfuse-init-signal-1:/init-signal
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh
      - ./custom-docker-entrypoint.worker.sh:/custom-docker-entrypoint.worker.sh
    secrets:
      - langfuse_env
      - langfuse_clickhouse_env
      - langfuse_minio_env
      - langfuse_postgres_env
      - redis_env

    entrypoint: [
      "dumb-init",
      "--",
      "/custom-docker-entrypoint.worker.sh"
    ]
    # When entrypoint is specified in the compose file, the CMD in the Dockerfile is
    # will be ignored. Hence, extract its value and add it here in the compose file:
    #   docker inspect langfuse/langfuse:3.24 | jq '.[0].Config.Cmd'
    command: [
        "node",
        "worker/dist/index.js"
    ]
    # set shared memory limit when using docker-compose
    shm_size: 128mb
