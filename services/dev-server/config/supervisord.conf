[supervisord]
nodaemon=true
minfds=1024
minprocs=200
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:weed-mount]
command=weed mount -filer="%(ENV_SEAWEEDFS_FILER)s" -filer.path="/buckets/codebase" -dir="/app" -dirAutoCreate=true -umask=000 -cacheCapacityMB=1000 %(ENV_WEED_MOUNT_EXTRA_ARGS)s
autostart=true
autorestart=true
startretries=3
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mount-helper]
# Dev server needs to bind two things: .venv and node_modules
command=/usr/local/bin/dev_mount_helper.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
depends_on=weed-mount
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:app]
# Using sleep infinity to keep container alive for interactive use
command=/custom-docker-entrypoint-nonpriv.sh sleep infinity
user=python
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
