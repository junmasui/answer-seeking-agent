# Prometheus Configuration for OpenTelemetry Collector Integration
# 
# This configuration sets up Prometheus to scrape metrics from:
# - OpenTelemetry Collector (primary source)
# - System monitoring endpoints
# 
# The OTel Collector now handles:
# - Application metrics collection via OTLP and Prometheus scraping
# - Trace collection and forwarding to Jaeger
# - Metric processing and enrichment

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Promethus will not start a new scrape for a target until the previous one
  # finishes or times out. There is still value in setting the timeout: it prevents
  # a stuck target from blocking forever, and ensures Prometheus eventually gives up
  # and logs a warning if a scrape hangs.
  scrape_timeout: 15s

alerting:
  alertmanagers:
    - static_configs: 
        - targets: [ 'alertmanager:9093' ]

scrape_configs:
  # Primary metrics source - OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']  # OTel Collector Prometheus exporter
    metrics_path: /metrics
    scrape_interval: 10s
    metric_relabel_configs:
      # Remove 'otel_' namespace prefix if desired
      - source_labels: [__name__]
        target_label: __name__
        regex: '^otel_(.*)'
        action: replace
        replacement: '${1}'

  # OpenTelemetry Collector internal metrics (self-monitoring)
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']  # Collector's own telemetry endpoint
    metrics_path: /metrics
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: __name__
        regex: '^(.*)'
        action: replace
        replacement: 'otelcol_${1}'

  # # Prometheus self-monitoring
  # - job_name: 'prometheus'
  #   static_configs:
  #     - targets: ['localhost:9090']
  #   scrape_interval: 30s

  # Grafana metrics (direct scraping still needed)
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
    scrape_interval: 30s

rule_files:
  - 'alert.rules.yml'
