# Root-level workspace configuration
# This file defines the uv workspace and shared configurations
# Individual projects are defined in their respective subdirectories

# IMPORTANT!!
#
# Do not include [build-system] or [project] at the workspace level.
# Each workspace member should define its own project configuration.
#

# Workspace-wide tool configurations
# These apply to all workspace members unless overridden

[dependency-groups]
dev = [
  "autopep8>=2.3.2",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.9.2",
  "typing-extensions>=4.14.1",
]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "apps/**/*.py", "libs/**/*.py"]
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "C", "D"]
ignore = [
  "D100", # Suppress D100 Missing docstring in public module
  "D103", # Suppress D103 Missing docstring in public function
  "D104", # Suppress D104 Missing docstring in public package
  "D203", # Suppress D203 Use a blank line to separate the docstring from the class definition
  "D212", # Supress D212 Multi-line docstring summary should start at the first line
  "D401", # Suppres D401 First line of docstring should be in imperative mood
  "D404" # Suppress D404 First word of the docstring should not be "This"
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

# Workspace-wide pytest configuration
[tool.pytest.ini_options]
testpaths = ["apps", "libs"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]

[tool.uv]
# Explicit declaration that the "cpu" and "cuda12" extras are in conflict
#
# See: https://github.com/astral-sh/uv/blob/main/docs/reference/settings.md#conflicts--conflicts-
#
conflicts = [
    [
      { extra = "cpu" },
      { extra = "cuda12" },
    ],
]

#
# https://docs.astral.sh/uv/reference/settings/#allow-insecure-host
#
allow-insecure-host = ["download.pytorch.org"]

# Search for every package name across all indexes, preferring the "best" version found. If a
# package version is in multiple indexes, only look at the entry for the first index.
#
# See: https://docs.astral.sh/uv/reference/settings/#index-strategy
#
index-strategy = "unsafe-best-match"

# Symbolically link packages from the wheel into the site-packages directory
#
# See: https://docs.astral.sh/uv/reference/settings/#link-mode
#
link-mode = "symlink"

# Global dependency version constraints for consistency across workspace
# These ensure all workspace members use compatible versions
constraint-dependencies = [
    # Core Python packages - ensure consistency
    "pytest>=8.3.4",
    "ruff>=0.9.2", 
    "autopep8>=2.3.2",
    
    # FastAPI ecosystem - lock compatible versions
    "fastapi>=0.104.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "uvicorn>=0.24.0",
    
    # Database - ensure compatible SQLAlchemy ecosystem
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0",
    
    # ML/AI - ensure compatible versions
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
]


[tool.uv.workspace]
members = [
    "apps/db_migration",
    "apps/core_app",
    "apps/core_worker",
    "apps/sim_auth_app",
    "libs/core",
    "libs/core_db",
    "libs/core_public",
    "libs/core_tasks",
    "libs/core_telemetry_distro",
    "libs/core_telemetry_instrumentation",
    "libs/early_init",
    "libs/log_config_monitor",
]

[tool.uv.sources]
# Define workspace dependencies
# Note: Only include packages that are actual workspace members

core-app = { workspace = true }
core-worker = { workspace = true }
sim-auth-app = { workspace = true }

core = { workspace = true }
core-db = { workspace = true }
core-public = { workspace = true }
core-tasks = { workspace = true }
core-telemetry-distro = { workspace = true }
core-telemetry-instrumentation = { workspace = true }
early-init = { workspace = true }
log-config-monitor = { workspace = true }

# Alembic/migrations package
migrations = { workspace = true }


# PyTorch package sources with CPU/CUDA variants
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda12", extra = "cuda12" }
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda12", extra = "cuda12" }
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda12", extra = "cuda12" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda12"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
