services:
  celery-worker:

    image: 'localhost/localhost/agent-backend:python-3.12-cuda12'
    profiles: [  celery, backend, all ]

    environment:
      DEBUGGER_LISTEN: true
      HEALTHCHECK_URL: 'http://127.0.0.1:8101/status'
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.


      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
    env_file:
      - backend.env
      - opentelemetry-instrument.env
    networks:
      - agent-net
    volumes:
      # Mount the project directory to /app in the container
      ##SRC - ../../../backend:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      ##SRC - ../build/run_celery_worker.sh:/run_celery_worker.sh:ro
      - ../config/healthcheck.sh:/healthcheck.sh:ro
      - backend-init-signal-1:/init-signal
      ##SRC - ../build/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
    secrets:
      - agent_secrets
      - agent_jwt_secrets
      - agent_seaweedfs_secrets
      - agent_postgres_secrets
      - checkpoints_postgres_secrets
      - redis_secrets
      - weaviate_secrets
      - codebase_seaweedfs_secrets

    user: root
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ '/custom-docker-entrypoint.sh' ]
    command: [ '/run_celery_worker.sh' ]
    deploy:
      resources:
        limits:
          cpus: '0.5' # 50% of available CPU resources
          memory: 8G # Give enough to run Tesseract and local model
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      # Two-phase health check:
      #   Phase 1 — While the Python environment is syncing, the sentinel
      #   file does not exist and the script returns exit 0.
      #   Phase 2 — Once the Celery worker_ready signal fires it starts a
      #   tiny HTTP health server on port 8101 and writes /tmp/app-ready.
      #   The script then curls that endpoint.
      test: ['CMD', 'bash', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 5s

          
  celery-flower:

    image: 'localhost/localhost/agent-backend:python-3.12-cpu'
    profiles: [ celery, backend, all ]

    environment:
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.

      HEALTHCHECK_URL: 'http://127.0.0.1:5555/'
      GPU_MODE: cpu
    env_file:
      - backend.env
    ports: # use if it is necessary to expose the container to the host machine
      - '25555:5555'
    networks:
      agent-net: {}
    volumes:
      # Mount the project directory to /app in the container
      ##SRC - ../../../backend:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      ##SRC - ../build/run_celery_flower.sh:/run_celery_flower.sh:ro
      - ../config/healthcheck.sh:/healthcheck.sh:ro
      - backend-init-signal-1:/init-signal
      ##SRC - ../build/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
    secrets:
      - agent_secrets
      - agent_jwt_secrets
      - agent_seaweedfs_secrets
      - agent_postgres_secrets
      - celery_flower_secrets
      - checkpoints_postgres_secrets
      - redis_secrets
      - weaviate_secrets
      - codebase_seaweedfs_secrets

    user: root
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ '/custom-docker-entrypoint.sh' ]
    command: [ '/run_celery_flower.sh' ]

    healthcheck:
      # Two-phase health check:
      #   Phase 1 — While the Python environment is syncing, the sentinel
      #   file does not exist and the script returns exit 0.
      #   Phase 2 — Once the run script writes /tmp/app-ready and Flower
      #   starts, the script curls Flower's root endpoint.
      test: ['CMD', 'bash', '/healthcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 5s



  celery-exporter:

    image: 'docker.io/danihodovic/celery-exporter:0.12.2'
    profiles: [ celery, backend, all ]

    env_file:
      - backend.env
      - celery-exporter.env
    ports:
      - '29808:9808'
    networks:
      agent-net: {}
    volumes:
      - backend-init-signal-1:/init-signal
      - ../config/custom-docker-entrypoint.exporter.sh:/custom-docker-entrypoint.exporter.sh:ro
    secrets:
      - redis_secrets

    entrypoint: [ 'bash', '/custom-docker-entrypoint.exporter.sh' ]
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    # command: null
    deploy:
      resources:
        limits:
          cpus: '0.1' # 10% of available CPU resources

    restart: unless-stopped

    healthcheck:
      # The danihodovic/celery-exporter image is based on python:3.13-slim-bookworm,
      # which does not have curl or wget installed.
      # To support the health check, we use a Python one-liner that uses the standard
      # library's urllib.request module. This script will attempt to connect to
      # the /health endpoint on port 9808 and exit with a status code
      # indicating success (0) or failure (1).
      #
      # Use the IPv4 loopback address. When 'localhost' is used, urllib will try to use
      # the IPv6 ::1 address where there is no listening port.
      test: [
        'CMD',
        'python3',
        '-c',
        "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:9808/health').getcode() == 200 else sys.exit(1)"
      ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 5s


#
# Named volumes are not created until the dependent service
# is started.
#
volumes:
  backend-init-signal-1:
    driver: local
