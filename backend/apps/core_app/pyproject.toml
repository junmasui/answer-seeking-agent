[project]
name = "core-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jun Masui", email = "76625904+junmasui@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
  "core",
  "core-public",
  "core-telemetry-distro",
  "core-telemetry-instrumentation",
  "early-init",
  "log-config-monitor",
  "alembic>=1.15.1",
  "alembic-postgresql-enum>=1.7.0",
  "alembic-utils>=0.8.6",
  "fastapi[standard]>=0.115.6",
  "watchdog[watchmedo]>=6.0.0",
  "typing-extensions>=4.14.1",
  "httpx>=0.23.0",
  "pyjwt>=2.10.1",
]

[project.scripts]

# Dependency groups following workspace DRY principles
# Common groups are inherited from workspace-level constraints
[dependency-groups]
dev = [
  # Core development tools (versions constrained at workspace level)
  "pytest",
  "pytest-asyncio", 
  "ruff",
  "autopep8",
  # Project-specific dev tools
  "httpx>=0.25.0",  # For testing FastAPI endpoints
]

test = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "httpx",  # For API testing
]

# Project-specific dependency groups
api = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "pydantic",
]

[project.optional-dependencies]
# Inherit from workspace CPU/CUDA options
cpu = []  # Will use workspace-defined torch CPU variant
cuda12 = []  # Will use workspace-defined torch CUDA variant

# Project-specific optional dependencies
monitoring = [
  "prometheus-client",
  "opentelemetry-api",
  "opentelemetry-sdk",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
