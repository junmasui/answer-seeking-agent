name: seaweedfs

services:
    seaweedfs:
        restart: unless-stopped
        image: localhost/localhost/seaweedfs:latest
        profiles: [ seaweedfs, infrastructure, all ]

        env_file:
            - seaweedfs.env

        # We map 8333 to host 8333 by default to avoid conflict with existing MinIO (9000).
        # User can change this if they want to replace MinIO completely.
        ports:
            - '29000:9000'
            - '29005:9005' # Master port
            - '29002:9002' # Filer port

        networks:
            - agent-net

        volumes:
            - seaweedfs-data:/data
            - ../config/s3.json.template:/etc/seaweedfs/s3.json.template:ro
            - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro

        secrets:
            - seaweedfs_secrets

        entrypoint: [ '/custom-docker-entrypoint.sh' ]
        # Start S3 service, Filer, and Master in one process for simplicity (single container mode)
        # -s3: start S3 gateway
        # -filer: start Filer
        # -master: start Master
        # -volume: start Volume server (implicitly started by server command usually)
        # 'server' command starts master, volume, filer, and s3.
        command: server -master.port=9005 -s3 -s3.port=9000 -filer.port=9002 -dir=/data -ip.bind=0.0.0.0 -ip=seaweedfs -volume.port=8080 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=100

        mem_limit: 2g
        memswap_limit: 4g

        healthcheck:
            # Use the IPv4 loopback address. When 'localhost' is used, curl will try to use
            # the IPv6 ::1 address where there is no listening port.
            test: [ "CMD", "curl", "-f", "http://127.0.0.1:9005/" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    seaweedfs-init:
        restart: 'no'

        image: localhost/localhost/init-seaweedfs:latest
        profiles: [ seaweedfs, infrastructure, all, run-and-done ]

        env_file:
            - seaweedfs.env
            - seaweedfs.init.env
        networks:
            - agent-net
        volumes:
            - ../config/init-seaweedfs.sh:/init-seaweedfs.sh:ro
            - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
        secrets:
            - seaweedfs_secrets
            - agent_seaweedfs_secrets

        # init-seaweedfs.sh will now refer to 'weed shell'
        command: /init-seaweedfs.sh

    seaweedfs-init-autotest:
        restart: 'no'

        image: localhost/localhost/init-seaweedfs:latest
        profiles: [ seaweedfs, infrastructure, all, run-and-done ]

        env_file:
            - seaweedfs.env
            - seaweedfs.init.autotest.env
        networks:
            - agent-net
        volumes:
            - ../config/init-seaweedfs.sh:/init-seaweedfs.sh:ro
            - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
        secrets:
            - seaweedfs_secrets
            - agent_seaweedfs_autotest_secrets

        # init-seaweedfs.sh will now refer to 'weed shell'
        command: /init-seaweedfs.sh

    # This service is responsible for initializing the 'codebase' bucket and user
    seaweedfs-init-codebase:
        image: localhost/localhost/init-seaweedfs:latest
        profiles: [ infrastructure, all ]
        networks:
            - agent-net
        volumes:
            - ../config/init-seaweedfs.sh:/init-seaweedfs.sh:ro
        secrets:
            - agent_seaweedfs_secrets
        environment:
            # We reuse the same secrets file but we expect CODEBASE_ACCESS_KEY/SECRET_KEY to be present or defaulted in the script if not
            - SEAWEEDFS_FILER=seaweedfs:9002
            - SEAWEEDFS_MASTER=seaweedfs:9005
            - S3_BUCKET_NAME=codebase
            # Use indirection
            - S3_ACCESS_KEY_VAR=CODEBASE_ACCESS_KEY
            - S3_SECRET_KEY_VAR=CODEBASE_SECRET_KEY
        entrypoint: [ "/init-seaweedfs.sh" ]
        depends_on:
            seaweedfs:
                condition: service_started

    seaweedfs-init-mlflow:
        image: localhost/localhost/init-seaweedfs:latest
        profiles: [ infrastructure, all ]
        networks:
            - agent-net
        env_file:
            - seaweedfs.env
            - seaweedfs.init.mlflow.env
        volumes:
            - ../config/init-seaweedfs.sh:/init-seaweedfs.sh:ro
        secrets:
            - seaweedfs_secrets
            - mlflow_seaweedfs_secrets

        command: /init-seaweedfs.sh
        depends_on:
            seaweedfs:
                condition: service_started

volumes:
    seaweedfs-data:

        driver: local
