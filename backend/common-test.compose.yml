services:
  init-backend-test-volumes:
    restart: 'no'

    image: 'docker.io/python:3.12.8-slim-bookworm'
    profiles: [ init-volumes, backend-test, all ]

    # No network is needed to initialize named volumes
    network_mode: none
    volumes:
      - backend-test-home-1:/home/python/test-home-1
      - backend-test-venv-1:/home/python/test-venv-1
      - backend-test-staging-1:/home/python/test-staging-1
      - backend-test-home-2:/home/python/test-home-2
      - backend-test-venv-2:/home/python/test-venv-2
      - backend-test-prometheus-2:/home/python/test-prometheus-2
      - backend-test-staging-2:/home/python/test-staging-2
      - backend-test-home-3:/home/python/test-home-3
      - backend-test-venv-3:/home/python/test-venv-3
      - backend-test-home-4:/home/python/test-home-4
      - backend-test-venv-4:/home/python/test-venv-4

    entrypoint: 'bash'
    command:
      - '-c'
      # Beware that docker-compose also performs variable interpolation.
      # So we need to escape the dollar sign with $$name so that bash
      # will recieve our embedded script with $name. 
      - |
        set -ex ;

        ls -ld /home/python/

        for VOL in \
          'test-home-1' 'test-venv-1' 'test-staging-1' \
          'test-home-2' 'test-venv-2' 'test-staging-2' 'test-prometheus-2' \
          'test-venv-3' 'test-home-3' \
          'test-venv-4' 'test-home-4'
        do
          touch /home/python/$$VOL/.initialized
          chown -R 1000:1000 /home/python/$$VOL
          chmod -R 755 /home/python/$$VOL
          ls -ld /home/python/$$VOL
        done

  backend-test-dependency-gate:
    restart: 'no'

    image: localhost/localhost/debian-slim-util:1.0
    profiles: [ backend-test, infrastructure, all ]

    env_file:
      - dependency-gate.env
      - integration-test.env
    networks:
      - agent-poc
    volumes:
      - backend-test-init-signal-1:/init-signal
      - ./run_test_dependency_gate.sh:/run_test_dependency_gate.sh:ro
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh:ro
      - ../dependency-gate/wait_for_resource.sh:/wait_for_resource.sh:ro
    secrets:
      - answers_minio_test_secrets
      - answers_postgres_test_secrets
      - checkpoints_postgres_test_secrets
      - redis_secrets
      - weaviate_secrets

    mem_limit: 128m
    memswap_limit: 128m
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    entrypoint: 'bash'
    command: [ /run_test_dependency_gate.sh ]


  fastapi-integration-server:
    depends_on:
      init-backend-test-volumes:
        condition: service_completed_successfully

    image: 'localhost/localhost/answers-backend-dev:python-3.12-cuda12'
    profiles: [ backend-test, all ]

    environment:
      DEBUGGER_LISTEN: true
      JWT_WRITE_CLAIM_MISSING_OK: true
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
    env_file:
      - integration-test.env
    ports: # use if it is necessary to expose the container to the host machine
      - '8102:8100'
    networks:
      - agent-poc
    volumes:
      # Mount the project directory to /app in the container
      - .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_fastapi_dev_server.sh:/run_fastapi_dev_server.sh:ro
      - backend-test-init-signal-1:/init-signal
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh:ro
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
      - backend-test-home-1:/home/python
      - backend-test-venv-1:/app/.venv
      - backend-test-staging-1:/staging
    secrets:
      - answers_test_secrets
      - answers_api_key_test_secrets
      - answers_jwt_test_secrets
      - answers_minio_test_secrets
      - answers_postgres_test_secrets
      - checkpoints_postgres_test_secrets
      - redis_secrets
      - weaviate_secrets

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_fastapi_dev_server.sh' ]
    deploy:
      resources:
        limits:
          memory: 4G # Give enough to run local model
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      # When this service start for the first time, there is multiple minutes while the
      # python environment is sync'ed to the requirements file then when the FastAPI server
      # is starting up. A health-check based on API pinging will fail during the sync and the
      # start up.
      #
      # For now, we just check if python3 can run. Later, we will  try to come up  
      ## test: ['CMD', 'curl', '-f', 'http://localhost']
      test: ['CMD', 'python3', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  celery-integration-worker:
    depends_on:
      init-backend-test-volumes:
        condition: service_completed_successfully

    image: 'localhost/localhost/answers-backend-dev:python-3.12-cuda12'
    profiles: [ backend-test, all ]

    environment:
      DEBUGGER_LISTEN: true
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
    env_file:
      - integration-test.env
    ports: # use if it is necessary to expose the container to the host machine
      - '28991:8989'
    networks:
      - agent-poc
    volumes:
      # Mount the project directory to /app in the container
      - .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_celery_worker.sh:/run_celery_worker.sh:ro
      - backend-test-init-signal-1:/init-signal
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh:ro
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
      - backend-test-home-2:/home/python
      - backend-test-venv-2:/app/.venv
      - backend-test-staging-2:/staging
      - backend-test-prometheus-2:/var/local/prometheus
    secrets:
      - answers_test_secrets
      - answers_api_key_test_secrets
      - answers_jwt_test_secrets
      - answers_minio_test_secrets
      - answers_postgres_test_secrets
      - checkpoints_postgres_test_secrets
      - redis_secrets
      - weaviate_secrets

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_celery_worker.sh' ]
    deploy:
      resources:
        limits:
          memory: 8G # Give enough to run Tesseract and local model
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      # When this service start for the first time, there is multiple minutes while the
      # python environment is sync'ed to the requirements file then when the celery worker
      # is starting up. A health-check based on API pinging will fail during the sync and the
      # start up.
      #
      # For now, we just check if python3 can run. Later, we will  try to come up  
      ## test: ['CMD', 'curl', '-f', 'http://localhost']
      test: ['CMD', 'python3', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

          
  celery-integration-flower:
    depends_on:
      init-backend-test-volumes:
        condition: service_completed_successfully

    image: 'localhost/localhost/answers-backend-dev:python-3.12-cpu'
    profiles: [ backend-test, all ]

    environment:
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'
      GPU_MODE: cpu
    env_file:
      - backend.env
    ports: # use if it is necessary to expose the container to the host machine
      - '25557:5555'
    networks:
      agent-poc: {}
    volumes:
      ### Mount the project directory to /app in the container
      ##- .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_celery_flower.sh:/run_celery_flower.sh:ro
      - backend-test-init-signal-1:/init-signal
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh:ro
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
      - backend-test-home-3:/home/python
      - backend-test-venv-3:/app/.venv
    secrets:
      - answers_test_secrets
      - answers_api_key_test_secrets
      - answers_jwt_test_secrets
      - answers_minio_test_secrets
      - answers_postgres_test_secrets
      - celery_flower_test_secrets
      - checkpoints_postgres_test_secrets
      - redis_secrets
      - weaviate_secrets

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_celery_flower.sh' ]

    healthcheck:
      # When this service start for the first time, there is multiple minutes while the
      # python environment is sync'ed to the requirements file then when the celery flower node
      # is starting up. A health-check based on API pinging will fail during the sync and the
      # start up.
      #
      # For now, we just check if python3 can run. Later, we will  try to come up  
      ## test: ['CMD', 'curl', '-f', 'http://localhost']
      test: ['CMD', 'python3', '--version']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  integration-test:
    depends_on:
      init-backend-test-volumes:
        condition: service_completed_successfully

    image: 'localhost/localhost/answers-backend-dev:python-3.12-cpu'
    profiles: [ backend-test, all ]

    environment:
      DEBUGGER_LISTEN: true
      # Only environment variables that are important to a Docker environment
      # will be configured here. The reason is that changes to environment variables
      # configured here do require a restart before they take effect:
      # application-centric ones should be designed to avoiid a Docker container restart.
      #
      # The Python bytecode cache should be moved away from the bind-mount because
      # there is no need for it shared with the host.
      PYTHONPYCACHEPREFIX: '/home/python/.cache/pycache'

      # https://github.com/docker/compose/issues/6029
      PYTHONUNBUFFERED: 1
      ##
      ## Override YML is responsible for setting GPU_MODE to 'cuda12' or 'cpu'
      ##
      GPU_MODE: cpu
    env_file:
      - integration-test.env
    networks:
      - agent-poc
    volumes:
      - backend-test-init-signal-1:/init-signal
      # Mount the project directory to /app in the container
      - .:/app
      # Mount important scripts into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_integration_test.sh:/run_integration_test.sh:ro
      - backend-test-init-signal-1:/init-signal
      - ../dependency-gate/wait_for_gate.sh:/wait_for_gate.sh:ro
      - ./custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
      - backend-test-home-4:/home/python
      - backend-test-venv-4:/app/.venv
    secrets:
      - answers_test_secrets
      - answers_api_key_test_secrets
      - answers_jwt_test_secrets
      - answers_minio_test_secrets
      - answers_postgres_test_secrets
      - celery_flower_test_secrets
      - checkpoints_postgres_test_secrets
      - redis_secrets

    user: '1000:1000'
    # Beware: when entrypoint is used in the compose file, the CMD in the Dockerfile is ignored.
    # See: https://docs.docker.com/reference/compose-file/services/#entrypoint
    entrypoint: [ 'bash', '/custom-docker-entrypoint.sh' ]
    command: [ '/run_integration_test.sh' ]


#
# Named volumes are not created until the dependent service
# is started.
#
volumes:
  backend-test-init-signal-1:
    driver: local
  backend-test-home-1:
    driver: local
  backend-test-venv-1:
    driver: local
  backend-test-staging-1:
    driver: local
  backend-test-home-2:
    driver: local
  backend-test-venv-2:
    driver: local
  backend-test-staging-2:
    driver: local
  backend-test-prometheus-2:
    driver: local
  backend-test-home-3:
    driver: local
  backend-test-venv-3:
    driver: local
  backend-test-home-4:
    driver: local
  backend-test-venv-4:
    driver: local
