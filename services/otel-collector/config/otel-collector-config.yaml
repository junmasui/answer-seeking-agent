# OpenTelemetry Collector Configuration
# This configuration sets up the collector to:
# 1. Receive telemetry data from applications via OTLP
# 2. Scrape Prometheus metrics from existing endpoints
# 3. Export metrics to Prometheus via HTTP endpoint
# 4. Export traces to Jaeger
# 5. Process and enrich telemetry data

receivers:
  # OTLP receiver for applications sending telemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

  # Raw TCP
  tcplog/docker:
    listen_address: "0.0.0.0:2255"
    add_attributes: true     # adds net.peer.ip, etc.[52]
    one_log_per_packet: false

  # Zipkin receiver for applications sending Zipkin-formatted traces
  zipkin:
    endpoint: 0.0.0.0:9411

  # Prometheus receiver to scrape existing metrics endpoints
  # This allows gradual migration from direct Prometheus scraping
  prometheus:
    config:
      global:
        scrape_interval: 30s
        scrape_timeout: 5s
      scrape_configs:
        # # FastAPI application metrics
        # - job_name: 'api-server'
        #   dns_sd_configs:
        #     - names: ['api-server']
        #       type: 'A'
        #       port: 8100
        #   metrics_path: /metrics

        # # FastAPI application metrics
        # - job_name: 'api-server-autotest'
        #   dns_sd_configs:
        #     - names: ['api-server-autotest']
        #       type: 'A'
        #       port: 8100
        #   metrics_path: /metrics

        # # Celery worker metrics
        # - job_name: 'celery-worker'
        #   dns_sd_configs:
        #     - names: ['celery-worker']
        #       type: 'A'
        #       port: 8989
        #   metrics_path: /metrics

        # # Celery exporter metrics
        # - job_name: 'celery-exporter'
        #   dns_sd_configs:
        #     - names: ['celery-exporter']
        #       type: 'A'
        #       port: 9808
        #   metrics_path: /metrics

        # Celery flower metrics
        - job_name: 'celery-flower'
          dns_sd_configs:
            - names: ['celery-flower']
              type: 'A'
              port: 5555
          metrics_path: /metrics

        # Grafana metrics
        - job_name: 'grafana'
          dns_sd_configs:
            - names: ['grafana']
              type: 'A'
              port: 3000
          metrics_path: /metrics

  # Host metrics receiver (optional - for system metrics)
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
      network:
      process:

processors:
  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  # Batch processor for better performance
  batch/metrics:
    send_batch_size: 512
    timeout: 5s
    send_batch_max_size: 2048
  batch/traces:
    send_batch_size: 32
    timeout: 1s
    send_batch_max_size: 512
  batch/logs:
    send_batch_size: 1
    timeout: 1s
    send_batch_max_size: 1024

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: service.instance.id
        value: "${POD_NAME}"
        action: upsert
      - key: service.name
        from_attribute: service.name
        action: upsert
      - key: service.version
        value: service.version
        action: upsert
      - key: deployment.environment
        value: "${OTEL_ENVIRONMENT}"
        action: insert

  # Attributes processor for enrichment
  attributes:
    actions:
      - key: collector.name
        value: "otel-collector-1"
        action: insert
      - key: collector.version
        value: "1.0.0"
        action: insert

exporters:
  # Prometheus exporter - exposes metrics for Prometheus to scrape
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"
    const_labels:
      collector: "answer-seeking-agent"
    metric_expiration: 180m
    resource_to_telemetry_conversion:
      enabled: true

  # OTLP exporter for traces to Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlphttp/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Debug exporter for traces
  debug/traces:
    # verbosity: basic, normal, or detailed
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

  # Debug exporter for logs
  debug/logs:
    # verbosity: basic, normal, or detailed
    verbosity: basic
    sampling_initial: 1
    sampling_thereafter: 100

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # pprof extension for performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # zpages extension for debugging
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, attributes, batch/metrics]
      exporters: [prometheus]

    # Traces pipeline
    traces:
      receivers: [otlp, zipkin]
      processors: [memory_limiter, resource, attributes, batch/traces]
      exporters: [otlp/jaeger, debug/traces]

    # Logs pipeline (if needed)
    logs:
      receivers: [otlp, tcplog/docker]
      processors: [memory_limiter, resource, attributes]
      exporters: [otlphttp/logs, debug/logs]
