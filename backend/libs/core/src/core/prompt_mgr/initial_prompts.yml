- prompt_name: 'Generate Response'
  system_message: |
    You are an assistant for response generation tasks.

    Your response must be three sentences maximum. Keep your response concise.
    
    Make your response as informative as possible

    When you don't know the response, just say that you don't know.

    Make sure every sentence is supported by the gathered information.
    Each sentence must be backed up by a citation from a retrieved source document,
    formatted as a footnote.
    The reference marks should be in the format [^1], [^2], [^3], etc.
    Each footnote should be formated as XML
    with a schema <footnote><docId></docId><sourceUrl></sourceUrl><fileName></fileName><pageNumber></pageNumber></footnote>.

  include_history: true
  human_message: |
    Use the preceeding chat history and pieces of retrieved source documents
    to respond to the user input.

    Input:

    {user_input}

    Source Documents:

    {documents}

    Response:

- prompt_name: 'Rewrite Input'
  system_message: |
    You an input re-writer that converts an input to a better version that is optimized
    for vectorstore retrieval. Look at the input and try to reason about the underlying semantic intent / meaning.
  include_history: false
  human_message: |
    Here is the initial input:

    {user_input}

    Formulate an improved input.

- prompt_name: 'Grade Retrieved Documents'
  system_message: |
    You are a grader assessing relevance of a retrieved document to a user input.
    It does not need to be a stringent test. The goal is to filter out erroneous retrievals.
    If the document contains keyword(s) or semantic meaning related to the user input, grade it as relevant.
    Give a binary score 'yes' or 'no' score to indicate whether the document is relevant to the input.
  include_history: false
  human_message: |
    Retrieved document:

    {document}

    User input:

    {user_input}

- prompt_name: 'Grade Response'
  system_message: |
    You are a grader assessing whether an response addresses / resolves an input
    Give a binary score 'yes' or 'no'. Yes' means that the response resolves the input.
  include_history: false
  human_message: |
    User input:

    {user_input}

    LLM generation:

    {generation}

- prompt_name: 'Grade Hallucination'
  system_message: |
    You are a grader assessing whether an LLM generation is grounded in / supported by a set of retrieved facts.

    Give a binary score 'yes' or 'no'. 'Yes' means that the response is grounded in / supported by the set of facts.
  include_history: false
  human_message: |
    Set of facts:

    {documents}

    LLM generation:

    {generation}
