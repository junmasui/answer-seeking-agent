
services:
  init-frontend-volumes:
    restart: 'no'

    image: 'node:22-bookworm-slim'
    profiles: [ init-volumes, frontend, all ]

    # No network is needed to initialize named volumes
    network_mode: none
    volumes:
      - local-frontend-home-1:/home/node/home-1
      - local-frontend-node-modules-1:/home/node/node-modules-1

    entrypoint: 'bash'
    command:
      - '-c'
      # Beware that docker-compose also performs variable interpolation.
      # So we need to escape the dollar sign with $$name so that bash
      # will recieve our embedded script with $name. 
      - |
        set -ex ;

        ls -ld /home/node/

        for VOL in 'home-1' 'node-modules-1'
        do
          touch /home/node/$$VOL/.initialized
          chown -R 1000:1000 /home/node/$$VOL
          chmod -R 755 /home/node/$$VOL
          ls -ld /home/node/$$VOL
        done

  frontend-start-gate:
    restart: 'no'

    image: localhost/start-gate:1.0
    profiles: [ init-volumes, frontend, all ]

    networks:
      - agent-poc

    entrypoint: 'bash'
    command:
      - '-c'
      # Beware that docker-compose also performs variable interpolation.
      # So we need to escape the dollar sign with $$name so that bash
      # will recieve our embedded script with $name. 
      - |-

        set +e

        function wait_for_nslookup {
            declare TARGET_NAME=$${1}
            echo $$TARGET_NAME
            while true
            do
                nslookup $$TARGET_NAME 127.0.0.11
                echo nslookup $$TARGET_NAME 127.0.0.11
                if [ $$? -eq 0 ]
                then
                    echo "DNS name $$TARGET_NAME resolves"
                    break
                fi
                sleep 2
            done
        }

        wait_for_nslookup "vite-dev-server"
        wait_for_nslookup "fastapi-dev-server"



  vite-dev-server:
    depends_on:
      init-frontend-volumes:
        condition: service_completed_successfully

    image: 'localhost/answers-frontend:node-22-bookworm'
    profiles: [ frontend, all ]

    environment:
      # Only environment variables that are important to the Docker environment
      # will be configured here. All other environment variables are extracted
      # to .env files for easier and more isolated management.
      CHOKIDAR_USEPOLLING: 'true'
    #   - NODE_ENV=production
    ## Do not expose 5173 ... To prevent XSS (cross site scripting) usage, we want all
    ## traffic to go thru the reserve-proxy server at 15173.
    # ports:
    #   - '5173:5173'
    networks:
      - agent-poc
    volumes:
      # Mount the project directory to /app in the container
      - ./app:/app
      # Mount important script into the container when we are
      # avoiding rebuilding images to capture their latest version.
      - ./run_dev_server.sh:/run_dev_server.sh
      # Mounting a local area to use container-installed dependencies
      - local-frontend-home-1:/home/node
      - local-frontend-node-modules-1:/app/node_modules

    command: [ '/run_dev_server.sh' ]
    user: '1000:1000'

  proxy:
    depends_on:
      frontend-start-gate:
        condition: service_completed_successfully

    image: 'nginx:1.27.3-bookworm'
    profiles: [ frontend, all ]

    ports:
      # Expose the vite server to the host machine
      - '15173:15173'
    networks:
      - agent-poc
    volumes:
      # Mount the Nginx configuration file.
      - ./nginx_default.conf:/etc/nginx/conf.d/default.conf

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:15173']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  local-frontend-home-1:
    driver: local
  local-frontend-node-modules-1:
    driver: local
