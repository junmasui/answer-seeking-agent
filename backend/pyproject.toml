[project]
name = "app"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "", email = "" }]
dependencies = [
  "icecream>=2.1.4",
  ## "python-dotenv>=1.0.1",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "Apache-2.0" }

# IMPORTANT!!
#
# Do not include [build-system] at the workspace level.
#

[dependency-groups]
dev = [
  "autopep8>=2.3.2",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.9.2",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.5.1",
  "torchaudio>=2.5.1",
  "torchvision>=0.20.0"
]
cuda12 = [
  "torch>=2.5.1",
  "torchaudio>=2.5.1",
  "torchvision>=0.20.0"
]


[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "C", "D"]
ignore = [
  "D100", # Suppress D100 Missing docstring in public module
  "D103", # Suppress D103 Missing docstring in public function
  "D104", # Suppress D104 Missing docstring in public package
  "D203", # Suppress D203 Use a blank line to separate the docstring from the class definition
  "D212", # Supress D212 Multi-line docstring summary should start at the first line
  "D401", # Suppres D401 First line of docstring should be in imperative mood
  "D404" # Suppress D404 First word of the docstring should not be "This"
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.uv]
# Explicit declaration that the "cpu" and "cuda12" extras are in conflict
#
# See: https://github.com/astral-sh/uv/blob/main/docs/reference/settings.md#conflicts--conflicts-
#
conflicts = [
    [
      { extra = "cpu" },
      { extra = "cuda12" },
    ],
]

#
# https://docs.astral.sh/uv/reference/settings/#allow-insecure-host
#
allow-insecure-host = ["download.pytorch.org"]

# Search for every package name across all indexes, preferring the "best" version found. If a
# package version is in multiple indexes, only look at the entry for the first index.
#
# See: https://docs.astral.sh/uv/reference/settings/#index-strategy
#
index-strategy = "unsafe-best-match"

# Symbolically link packages from the wheel into the site-packages directory
#
# See: https://docs.astral.sh/uv/reference/settings/#link-mode
#
link-mode = "symlink"


[tool.uv.workspace]
members = [
    "apps/alembic",
    "apps/core_app",
    "apps/core_worker",
    "apps/sim_auth_app",
    "libs/core",
    "libs/core_tasks",
    "libs/core_telemetry",
    "libs/early_init",
    "libs/log_config_monitor",
]

[tool.uv.sources]
# Define workspace dependencies

migrations = { workspace = true }
core-app = { workspace = true }
core-worker = { workspace = true }
sim-auth-app = { workspace = true }

core = { workspace = true }
core-tasks = { workspace = true }
core-telemetry = { workspace = true }
early-init = { workspace = true }
log-config-monitor = { workspace = true }


#
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda12", extra = "cuda12" }
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda12", extra = "cuda12" }
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda12", extra = "cuda12" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda12"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
