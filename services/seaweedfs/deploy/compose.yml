name: seaweedfs

services:
    seaweedfs:
        restart: unless-stopped
        image: localhost/localhost/seaweedfs:latest
        profiles: [ seaweedfs, infrastructure, all ]

        env_file:
            - seaweedfs.env

        # We map 8333 to host 8333 by default to avoid conflict with existing MinIO (9000).
        # User can change this if they want to replace MinIO completely.
        ports:
            - '9000:9000'
            - '9005:9005' # Master port
            - '9002:9002' # Filer port

        networks:
            - agent-poc

        volumes:
            - seaweedfs-data:/data
            - ../config/s3.json.template:/etc/seaweedfs/s3.json.template:ro
            - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro

        secrets:
            - seaweedfs_secrets

        entrypoint: [ '/custom-docker-entrypoint.sh' ]
        # Start S3 service, Filer, and Master in one process for simplicity (single container mode)
        # -s3: start S3 gateway
        # -filer: start Filer
        # -master: start Master
        # -volume: start Volume server (implicitly started by server command usually)
        # 'server' command starts master, volume, filer, and s3.
        command: server -master.port=9005 -s3 -s3.port=9000 -filer.port=9002 -dir=/data -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json

        mem_limit: 2g
        memswap_limit: 4g

        healthcheck:
            # Use the IPv4 loopback address. When 'localhost' is used, curl will try to use
            # the IPv6 ::1 address where there is no listening port.
            test: [ "CMD", "curl", "-f", "http://127.0.0.1:9005/" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    seaweedfs-init:
        restart: 'no'

        image: localhost/localhost/init-seaweedfs:latest
        profiles: [ seaweedfs, infrastructure, all, run-and-done ]

        env_file:
            - seaweedfs.env
            - seaweedfs.init.env
        networks:
            - agent-poc
        volumes:
            - ../config/init-seaweedfs.sh:/init-seaweedfs.sh:ro
            - seaweedfs-init-signal:/init-signal
            - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
        secrets:
            - seaweedfs_secrets
            - answers_seaweedfs_secrets

        # init-seaweedfs.sh will now refer to 'weed shell'
        command: /init-seaweedfs.sh

    seaweedfs-init-autotest:
        restart: 'no'

        image: localhost/localhost/init-seaweedfs:latest
        profiles: [ seaweedfs, infrastructure, all, run-and-done ]

        env_file:
            - seaweedfs.env
            - seaweedfs.init.autotest.env
        networks:
            - agent-poc
        volumes:
            - ../config/init-seaweedfs.sh:/init-seaweedfs.sh:ro
            - seaweedfs-init-signal:/init-signal
            - ../config/custom-docker-entrypoint.sh:/custom-docker-entrypoint.sh:ro
        secrets:
            - seaweedfs_secrets
            - answers_seaweedfs_autotest_secrets

        # init-seaweedfs.sh will now refer to 'weed shell'
        command: /init-seaweedfs.sh

volumes:
    seaweedfs-data:
        driver: local
    seaweedfs-init-signal:
        driver: local
