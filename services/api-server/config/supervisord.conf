[supervisord]
nodaemon=true
minfds=1024
minprocs=200
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:weed-mount]
; Command populated by entrypoint/env or defined here. 
; For flexibility, we can use a wrapper or define the standard command.
; However, we need environment variables (ACCESS_KEY etc). 
; Supervisor inherits env vars from the shell that started it.
command=weed mount -filer="%(ENV_SEAWEEDFS_FILER)s" -filer.path="/buckets/codebase/backend" -dir="/app/backend" -dirAutoCreate=true -umask=000 -map.uid=1000:0 -map.gid=1000:0 -cacheCapacityMB=1000 %(ENV_WEED_MOUNT_EXTRA_ARGS)s
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
; Ensure we don't start if FUSE isn't needed? 
; Note: If USE_FUSE_SRC_DIR is false, we might want to disable this.
; Supervisor doesn't have conditional start easily. 
; Better approach: The entrypoint decides which conf to use or generates it.
; BUT, for now, let's assume we use this conf ONLY when FUSE is enabled.

[program:mount-helper]
command=/usr/local/bin/mount_helper.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
depends_on=weed-mount
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:app]
; The original command to run the server, wrapped in the non-priv entrypoint to handle venv setup
command=/custom-docker-entrypoint-nonpriv.sh %(ENV_APP_COMMAND)s
user=python
# Explicitly set HOME.
environment=HOME="/home/python"
autostart=true
autorestart=%(ENV_APP_AUTORESTART)s
; This ensures app doesn't start until mount-helper finishes (conceptually).
; Supervisor doesn't support 'depends_on' natively in standard version. 
; We'll use a wrapper in run_api_server.sh or rely on mount_helper to block? 
; Actually, mount_helper just binds. The app might fail if it starts too early?
; Better: The 'app' command should wait for the mount if FUSE is on.
; Or use a 3rd party plugin. 
; Simplest: 'mount-helper' does the binding. 'app' script has a 'wait-for-mount' check (which it already kind of has via waiting for files?).
; To be robust: We'll add a 'wait_for_mount' loop in the app start script or wrapper?
; Actually, let's make the 'mount-helper' blocking: No, supervisor starts all in parallel.
; Resolution: The 'mount-helper' script is fast. The 'app' script (run_api_server.sh) should probably "wait for /app/backend/.venv/bin/activate" to exist.
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[eventlistener:stop-on-app-exit]
command=/stop_supervisor.sh
events=PROCESS_STATE_EXITED
