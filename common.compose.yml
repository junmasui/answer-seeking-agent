name: agent

include:
  - grafana/compose.yml
  - jaeger/compose.yml
  - loki/compose.yml
  - minio/compose.yml
  - opensearch/compose.yml
  - otel-collector/compose.yml
  - nemo/compose.yml
  - postgres/compose.yml
  - presidio/compose.yml
  - prometheus/compose.yml
  - redis/compose.yml
  - traefik/compose.yml
  - weaviate/compose.yml

networks:
  agent-poc:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'true'
      com.docker.network.driver.mtu: 1500
    ipam:
      config:
        - subnet: 172.31.1.0/24
          gateway: 172.31.1.1

secrets:
  minio_secrets:
    file: ./secrets/minio.secrets.env
  postgres_secrets:
    file: ./secrets/postgres.secrets.env
  redis_secrets:
    file: ./secrets/redis.secrets.env
  weaviate_secrets:
    file: ./secrets/weaviate.secrets.env
  opensearch_secrets:
    file: ./secrets/opensearch.secrets.env

  redis_conf:
    file: ./secrets/redis.conf

  grafana_secrets:
    file: ./secrets/grafana.secrets.env

  celery_flower_secrets:
    file: ./secrets/celery-flower.secrets.env
  celery_flower_dev_secrets:
    file: ./secrets/celery-flower.dev.secrets.env

  answers_secrets:
    file: ./secrets.env
  answers_api_key_secrets:
    file: ./secrets/answers.api-key.secrets.env
  answers_jwt_secrets:
    file: ./secrets/answers.jwt.secrets.env
  answers_minio_secrets:
    file: ./secrets/answers.minio.secrets.env
  answers_postgres_secrets:
    file: ./secrets/answers.postgres.secrets.env
  checkpoints_postgres_secrets:
    file: ./secrets/checkpoints.postgres.secrets.env

  answers_dev_secrets:
    file: ./secrets.dev.env
  answers_api_key_dev_secrets:
    file: ./secrets/answers.api-key.dev.secrets.env
  answers_jwt_dev_secrets:
    file: ./secrets/answers.jwt.dev.secrets.env
  answers_minio_dev_secrets:
    file: ./secrets/answers.minio.dev.secrets.env
  answers_postgres_dev_secrets:
    file: ./secrets/answers.postgres.dev.secrets.env
  checkpoints_postgres_dev_secrets:
    file: ./secrets/checkpoints.postgres.dev.secrets.env
